name: CI

# Verifies every push and pull request. Deploys are handled by Vercel's Git
# integration: main goes to production, other branches and PRs get previews.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Installs the lockfile exactly; fails if it disagrees with package.json.
      - run: npm ci

      # Type-checks (tsc -b) and builds the static site.
      - run: npm run build

      # Simulates every circuit against its expected truth table.
      - run: npm run check
