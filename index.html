<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <title>DecodeTree</title>
    <!-- GoatCounter (cookieless). Paths are always prefixed with
         decodetree.v01d.dev, whatever host serves the page (preview URLs,
         *.vercel.app, etc.), so every hit lands under that one name in the
         shared v01d dashboard. -->
    <script>
      window.goatcounter = { path: function (p) { return 'decodetree.v01d.dev' + p } }
    </script>
    <script data-goatcounter="https://v01d.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
